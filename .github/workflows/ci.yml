name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTEST_QT_API: pyqt6
      QT_QPA_PLATFORM: offscreen
      RELEASE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same Python as requirements-lock.txt (release env mldl, 3.13.x)
          python-version: "3.13"

      - name: Install locked requirements and test tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pytest-xdist

      - name: Test suite (offscreen, a skipped test fails)
        shell: pwsh
        # Wall-clock timing tests (marker "slow") are not reliable on shared runners;
        # the build gate on the release PC runs them.
        run: python -m pytest -q -rs -n auto -m "not slow"

      - name: Build with PyInstaller
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean petrophyter_pyqt_2.spec

      - name: Self-test of the built exe
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist\Petrophyter\Petrophyter.exe").Path
          $log = Join-Path (Get-Location).Path "selftest.log"
          $p = Start-Process -FilePath $exe -ArgumentList @("--self-test", "--self-test-log", "`"$log`"") -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Write manifest and checksums
        if: always()
        shell: pwsh
        run: |
          python -m pip list --format=freeze | Set-Content -Encoding ascii pip-freeze.txt
          $exe = "dist\Petrophyter\Petrophyter.exe"
          if (Test-Path $exe) {
            "$((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()) *Petrophyter.exe" |
              Set-Content -Encoding ascii SHA256SUMS.txt
          }

      - name: Upload manifest, self-test log and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-manifest
          path: |
            pip-freeze.txt
            selftest.log
            SHA256SUMS.txt
          if-no-files-found: warn
